name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # The suite finishes in ~2 min on a 2-core runner; anything longer is a
    # hung test, not a slow one — kill it so logs become readable.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        # verbose: when a test hangs, the log shows which one started last
        run: npm test -- --reporter=verbose
